# Redraws assets/stats.svg (numbers, languages, contribution calendar) once a day.
# No third-party stats service: the README never shows a broken image.

name: Profile stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/stats.py", ".github/workflows/stats.yml"]

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Draw stats.svg
        run: python3 .github/scripts/stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git commit -m "chore: refresh profile stats" || exit 0
          git push
