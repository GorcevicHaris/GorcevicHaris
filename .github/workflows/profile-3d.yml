# Path in repo: .github/workflows/profile-3d.yml
# Generates the 3D isometric contribution calendar into /profile-3d-contrib/

name: GitHub Profile 3D Contrib

on:
  schedule:
    # once a day at 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # SETTING_JSON: ./profile-3d-settings.json   # optional custom colors

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "chore: regenerate 3d contribution calendar" || exit 0
          git push
